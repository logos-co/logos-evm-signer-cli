s": "pass"}], "md": "### 3.5 Load the requester fixture\n\n```bash\nlogosctl module load evm_signer_cli_probe\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [], "md": "## Step 4: What the CLI cannot do\n\n`logosctl call` authenticates as the **host anchor** \u2014 one undifferentiated identity\ncovering the shells and every relayed token. Admitting it would make the CLI a legal\nbypass of the human, so the manager refuses it as an approver. The keystore refuses it\nas a custodian, so the CLI cannot import a key either, and it signs only when its\nmanager asks. The refusal string is identical everywhere, so a caller cannot use it\nto work out which check it failed."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call signer_manager_module pending --human || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"error\":\"not authorized\",\"ok\":false}\n", "status": "pass"}], "md": "### 4.1 The CLI is not an approver\n\n```bash\nlogosctl call signer_manager_module pending\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 str:pw --human || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"error\":\"not authorized\",\"ok\":false}\n", "status": "pass"}], "md": "### 4.2 \u2026and not a custodian\n\n```bash\nlogosctl call keystore_module import_private_key <privkey> str:pw\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module sign '{}' --human || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"error\":\"not authorized\",\"ok\":false}\n", "status": "pass"}], "md": "### 4.3 \u2026and cannot have the keystore sign\n\n```bash\nlogosctl call keystore_module sign '{\u2026}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call e ind": "run", "note": "", "output": "{\"approvers\":[\"evm_signer_ui\",\"evm_signer_cli\"],\"custodians\":[\"evm_keystore_ui\",\"evm_signer_cli_probe\"],\"ok\":true,\"signers\":[\"keystore_module\"]}\n", "status": "pass"}], "md": "### 5.2 The manager: who approves, who unlocks, and which signers it asks\n\n```bash\nlogosctl call signer_manager_module configure '{\"approvers\":[\"evm_signer_ui\",\"evm_signer_cli\"],\"custodians\":[\"evm_keystore_ui\",\"evm_signer_cli_probe\"],\"signers\":[\"keystore_module\"]}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli status --human", "exit_code": 0, "kind": "run", "note": "", "output": "{\"approvers\":[\"evm_signer_ui\",\"evm_signer_cli\"],\"custodians\":[\"evm_keystore_ui\",\"evm_signer_cli_probe\"],\"held\":true,\"hint\":null,\"identity\":\"evm_signer_cli\",\"last_error\":null,\"ok\":true,\"pending_count\":0,\"rendered\":null}\n", "status": "pass"}], "md": "### 5.3 evm_signer_cli now holds the role\n\n```bash\nlogosctl call evm_signer_cli status\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli_probe setup --human", "exit_code": 0, "kind": "run", "note": "", "output": "{\"address\":\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\",\"ok\":true}\n", "status": "pass"}], "md": "### 5.4 Import the test key\n\nThe fixture imports Foundry's well-known account 0 under the vault password\n`doctest-pw`. A custodian's call, admitted only because the keystore's document\nabove named it.\n\n```bash\nlogosctl call evm_signer_cli_probe setup\n```"}, {"execs": [], "md": "## Step 6: A request arrives\n\nIn a real session the watcher runs in its own terminal, for as long as the\noperator is on duty. Here it runs in the background and writes to a file.\nIt is armed **before** the request is made: the event plane buffers nothing."}, {"execs": [{"cmd": "sh -c './logos/bin/logosctl --config-dir ./session watch evm_signer_cli --json > watch.jsonl 2>&1 & echo $! > watch.pid'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 6.1 Start watching evm_signer_cli\n\n```bash\nlogosctl watch evm_signer_cli        # in its own terminal\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli_probe request str:hello-logos --human | tee request.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\"handle\":\"smh_9080f3ed018f171a04ee9d8eeb56be241\",\"ok\":true}\n", "status": "pass"}], "md": "### 6.2 The wallet asks for a signature\n\n```bash\nlogosctl call evm_signer_cli_probe request str:hello-logos\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "cat watch.jsonl", "exit_code": 0, "kind": "run", "note": "", "output": "{\"data\":{\"arg0\":1},\"event\":\"queue_changed\",\"module\":\"evm_signer_cli\",\"timestamp\":\"2026-10-28T19:17:27Z\"}\n{\"data\":{\"arg0\":\"smh_9080f3ed018f171a04ee9d8eeb56be241\",\"arg1\":\"\\n================================================================\\nSIGNING REQUEST  smh_9080f3ed018f171a04ee9d8eeb56be241\\n----------------------------------------------------------------\\n1.  Requested by: Signer CLI Probe (evm_signer_cli_probe)\\n    What that app says this is for. Its own words \u2014 this signer\\n    cannot check any of it.\\n  Purpose (claimed by the requester): Doc-test: sign \\\"hello-logos\\\"\\n----------------------------------------------------------------\\n2.  What you are signing\\n    The signer manager's own reading of the request, shown in full\\n    and never shortened. This is what the signature will cover.\\n  Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\n  Commitment: bcc72cbf1144833137ddfe48adeda2ae0c4f976abce77cf26c5f9bf5796d1c45\\n  2 item(s) to sign:\\n    [1] Sign text message\\n        Text: hello-logos\\n        Bytes: 0x68656c6c6f2d6c6f676f73\\n    [2] Transaction on chain 1\\n        To: 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2\\n        Value: 0\\n        Nonce: 0\\n        Gas limit: 60000\\n        Max fee per gas: 0 wei (0 gwei)\\n        Max priority fee per gas: 0 wei (0 gwei)\\n        ** ZERO PRIORITY FEE \u2014 this may never be included **\\n        Fee at most: 0 wei (0 of the native coin)\\n        Selector: 0xa9059cbb\\n        Data: 0xa9059cbb000000000000000000000000d8da6bf26964af9d7eed9e03e53415d37aa96045000000000000000000000000000000000000000000000000000000003b9aca00\\n----------------------------------------------------------------\\n3.  What this signer makes of section 2\\n    Decoded on this device from the lines above. Not part of what\\n    is signed, and every line says how sure it is.\\n  Item [2]:\\n  Interpreted: WETH \u2014 VERIFIED (this address is WETH on chain 1, and it declares this function)\\n    Function: transfer(address,uint256)\\n      dst: 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045\\n      wad: 1000000000\\n    In WETH units: 0.000000001 WETH\\n----------------------------------------------------------------\\nsigner:   keystore_module \u2014 asks for the account's password\\napprove:  logosctl call evm_signer_cli approve smh_9080f3ed018f171a04ee9d8eeb56be241 bcc72cbf1144833137ddfe48adeda2ae0c4f976abce77cf26c5f9bf5796d1c45 @/path/to/pwfile\\nreject:   logosctl call evm_signer_cli reject smh_9080f3ed018f171a04ee9d8eeb56be241\\n================================================================\"},\"event\":\"prompt\",\"module\":\"evm_signer_cli\",\"timestamp\":\"2026-10-28T19:17:27Z\"}\n", "status": "pass"}], "md": "### 6.3 The prompt, as the watcher saw it\n\n`evm_signer_cli` claimed the request the moment it was offered \u2014 claiming means\n\"this approver has it on screen\", not \"the human decided\" \u2014 and published three\nsections, numbered and never merged. Section 1 is what the requester *claims* this\nis for, in its own words. Section 2 is what will actually be signed, in the\nmanager's words, verbatim. Section 3 is the only text `evm_signer_cli` writes\nitself: the calldata of section 2, decoded offline against a vendored ABI database\nand labelled with how sure it is. The last two lines are the commands to type.\n\nSection 1's heading is the requester's installed name, then the exact id the manager\ngave. The name is the fixture's `display_name`, read from `package_manager`, which\n`logosctl` loads at boot, and never from the request. Without a package manager, or\nwith a name that is not short plain ASCII or that another package wears too, the id\nstands alone.\n\n```bash\n# the watcher's terminal\n```"}, {"execs": [{"cmd": "grep -o \"3\\.  What this signer.*\" watch.jsonl | head -1", "exit_code": 0, "kind": "run", "note": "", "output": "3.  What this signer makes of section 2\\n    Decoded on this device from the lines above. Not part of what\\n    is signed, and every line says how sure it is.\\n  Item [2]:\\n  Interpreted: WETH \u2014 VERIFIED (this address is WETH on chain 1, and it declares this function)\\n    Function: transfer(address,uint256)\\n      dst: 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045\\n      wad: 1000000000\\n    In WETH units: 0.000000001 WETH\\n----------------------------------------------------------------\\nsigner:   keystore_module \u2014 asks for the account's password\\napprove:  logosctl call evm_signer_cli approve smh_9080f3ed018f171a04ee9d8eeb56be241 bcc72cbf1144833137ddfe48adeda2ae0c4f976abce77cf26c5f9bf5796d1c45 @/path/to/pwfile\\nreject:   logosctl call evm_signer_cli reject smh_9080f3ed018f171a04ee9d8eeb56be241\\n================================================================\"},\"event\":\"prompt\",\"module\":\"evm_signer_cli\",\"timestamp\":\"2026-10-28T19:17:27Z\"}\n", "status": "pass"}], "md": "### 6.4 What the signer made of it\n\nThe fixture asks for two legs: a text message, and a WETH `transfer` on mainnet.\nThere is nothing to decode in a message, so section 3 covers item **[2]** only and\nsays so \u2014 an unlabelled reading would look like a description of the whole request.\n`VERIFIED` is the strong tier: the address is in the database *and* declares that\nselector. A selector that merely resolves, with nothing tying it to the address,\nreads `UNVERIFIED`; a request with nothing decodable in it at all drops the section\nrather than heading an empty one.\n\n```bash\n# the watcher's terminal, section 3\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli list --human", "exit_code": 0, "kind": "run", "note": "", "output": "{\"ok\":true,\"pending\":[{\"ageMs\":3251,\"error\":null,\"handle\":\"smh_9080f3ed018f171a04ee9d8eeb56be241\",\"legs\":2,\"purpose\":\"Doc-test: sign \\\"hello-logos\\\"\",\"requester\":\"evm_signer_cli_probe\",\"state\":\"rendered\"}]}\n", "status": "pass"}], "md": "### 6.5 The queue agrees\n\n```bash\nlogosctl call evm_signer_cli list\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli status --human \\\n  | python3 -c 'import sys,json; r=json.load(sys.stdin)[\"rendered\"]; open(\"handle.txt\",\"w\").write(r[\"handle\"]); open(\"bundle.txt\",\"w\").write(r[\"bundle_id\"]); print(r[\"handle\"], r[\"bundle_id\"])'\n", "exit_code": 0, "kind": "run", "note": "", "output": "smh_9080f3ed018f171a04ee9d8eeb56be241 bcc72cbf1144833137ddfe48adeda2ae0c4f976abce77cf26c5f9bf5796d1c45\n", "status": "pass"}], "md": "### 6.6 Note the handle and the bundle id\n\n```bash\nlogosctl call evm_signer_cli status\n```"}, {"execs": [], "md": "## Step 7: What is refused\n\n`approve` binds three things: the handle on screen, the bundle id the human read,\nand the password. Each refusal below happens **before** the password is used."}, {"execs": [{"cmd": "echo doctest-pw > pw.txt\n./logos/bin/logosctl --config-dir ./session call evm_signer_cli approve er\":\"keystore_module\",\"unlocked\":false}}\n", "status": "pass"}], "md": "### 7.3 A wrong password\n\nThe keystore's refusal, relayed by the manager as one sentence. The request stays\non screen, so the operator simply retypes.\n\n```bash\nlogosctl call evm_signer_cli approve <handle> <bundle_id> @bad.txt\n```"}, {"execs": [], "md": "## Step 8: Approve\n\nThe password file was written with `echo`, so it ends in a newline; `evm_signer_cli`\nstrips exactly one, the `--password-stdin` convention. The reply is a **count**:\nthe approver causes a signature to exist and never receives it. Only the requester\ncan collect it, with the receipt it was handed when it asked."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli approve \"$(cat handle.txt)\" \"$(cat bundle.txt)\" @pw.txt --human", "exit_code": 0, "kind": "run", "note": "", "output": "{\"handle\":\"smh_9080f3ed018f171a04ee9d8eeb56be241\",\"ok\":true,\"signed_count\":2}\n", "status": "pass"}], "md": "### 8.1 The human says yes\n\n```bash\nlogosctl call evm_signer_cli approve <handle> <bundle_id> @pw.txt\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call evm_signer_cli_probe outcome \"$(cat handle.txt)\" --human", "exit_code": 0, "kind": "run", "note": "", "output": "{\"ok\":true,\"psbt_signatures\":null,\"reason\":\"approved\",\"signed\":[\"0x0eb9f28352f7922f2cbd640d4569c5dce34e261a78413a14f029f34e3fdb6685799fe51ca446a9998cba505370e0f4e11cb8ae05d0cdef67f44fb940f04c693b1c\",\"0x02f8a70180808082ea6094c02aaa39b223fe8d0a0e5c4f27ead9083c756cc280b844a9059cbb000000000000000000000000d8da6bf26964af9d7eed9e03e53415d37aa96045000000000000000000000000000000000000000000000000000000003b9aca00c001a042b742fc581976ccdb4fe50ba544ddda7b0b925121f5fa04bc93afd8577d86f0a06007d4f790003d0d785955705c11a686677bec9007d75f81515c13e5b31cbdf1\"],\"state\":\"settled\"}\n", "status": "pass"}], "md": "### 8.2 The requester collects its signatures\n\n```bash\nlogosctl call evm_signer_cli_ <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
