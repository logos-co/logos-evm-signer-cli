[package]
name = "evm_signer_cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
logos_tx_decoder = { git = "https://github.com/logos-co/logos-tx-decoder", rev = "8b5f0ca5cf23a8f01786772e3860ecec13c5ff46" }
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
