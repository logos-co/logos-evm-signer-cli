[package]
name = "evm_signer_cli_probe"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
# A PSBT for the Bitcoin round, built offline from the wallet's xpub.
bitcoin = { version = "0.32.102", default-features = false, features = ["std", "base64"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
